<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>業務打合せ記録</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      margin: 0;
      padding: 12px;
      padding-bottom: 30px;

      background: #f2f2f7;
      color: #1c1c1e;
    }

    /* =========================
       全体
       ========================= */

    .app {
      max-width: 600px;
      margin: 0 auto;
    }

    .app-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin: 6px 4px 14px;
      color: #1c1c1e;
    }

    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .section-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 0 0 14px;
      color: #1c1c1e;
    }

    /* =========================
       訪問状態
       ========================= */

    .visit-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      padding: 10px 12px;
      border-radius: 10px;
      background: #f8f9fa;
      border: 1px solid #e5e5ea;

      margin-bottom: 12px;
    }

    .status-left {
      min-width: 0;
    }

    .status-label {
      font-size: 0.75rem;
      color: #8e8e93;
      margin-bottom: 2px;
    }

    .status-value {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .status-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #8e8e93;
      margin-right: 5px;
    }

    .status-dot.active {
      background: #34c759;
    }

    /* =========================
       開始・終了
       ========================= */

    .time-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-start,
    .btn-end {
      min-height: 52px;
      border: none;
      border-radius: 11px;

      color: white;
      font-size: 1rem;
      font-weight: 700;

      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-start {
      background: #34c759;
    }

    .btn-start:active {
      background: #28a745;
      transform: scale(0.98);
    }

    .btn-end {
      background: #ff9500;
    }

    .btn-end:active {
      background: #e08200;
      transform: scale(0.98);
    }

    .btn-start:disabled,
    .btn-end:disabled {
      opacity: 0.35;
      cursor: default;
      transform: none;
    }

    /* =========================
       時間情報
       ========================= */

    .time-info {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;

      background: #f8f9fa;
      border-radius: 10px;
      border: 1px solid #e5e5ea;

      font-size: 0.82rem;
      line-height: 1.7;
    }

    .time-info.show {
      display: block;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .time-row span:first-child {
      color: #636366;
    }

    .time-row span:last-child {
      font-weight: 600;
      text-align: right;
    }

    /* =========================
       フォーム
       ========================= */

    .form-group {
      margin-bottom: 14px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #636366;
    }

    input[type="text"],
    input[type="number"],
    textarea,
    select {
      width: 100%;

      padding: 12px;

      border: 1px solid #c7c7cc;
      border-radius: 9px;

      font-family: inherit;
      font-size: 1rem;

      background: #fff;
      color: #1c1c1e;

      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #007aff;
      box-shadow: 0 0 0 2px rgba(0,122,255,0.12);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.5;
    }

    /* =========================
       訪問先
       ========================= */

    #visitTarget {
      font-size: 1.05rem;
      font-weight: 500;
    }

    /* =========================
       打合せ者
       ========================= */

    .attendee-group {
      display: grid;
      grid-template-columns: 1fr 92px;
      gap: 8px;
    }

    /* =========================
       車両情報
       ========================= */

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .unit-input {
      position: relative;
    }

    .unit-input input {
      padding-right: 42px;
    }

    .unit {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);

      font-size: 0.85rem;
      color: #8e8e93;

      pointer-events: none;
    }

    /* =========================
       記録ボタン
       ========================= */

    .btn-record {
      width: 100%;
      min-height: 56px;

      border: none;
      border-radius: 12px;

      background: #007aff;
      color: white;

      font-size: 1.1rem;
      font-weight: 700;

      cursor: pointer;

      margin-top: 6px;

      -webkit-tap-highlight-color: transparent;
    }

    .btn-record:active {
      background: #0067d9;
      transform: scale(0.98);
    }

    .btn-record:disabled {
      background: #c7c7cc;
      cursor: default;
      transform: none;
    }

    .record-hint {
      text-align: center;
      color: #8e8e93;
      font-size: 0.75rem;
      margin-top: 8px;
    }

    /* =========================
       ログ一覧
       ========================= */

    .log-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;

      margin-bottom: 10px;
    }

    .log-count {
      color: #8e8e93;
      font-size: 0.8rem;
    }

    .log-item {
      border: 1px solid #e5e5ea;
      border-radius: 11px;

      margin-bottom: 9px;
      overflow: hidden;

      background: #fff;
    }

    .log-summary {
      padding: 12px;
      cursor: pointer;
    }

    .log-summary:active {
      background: #f8f9fa;
    }

    .log-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .log-number {
      flex-shrink: 0;

      font-size: 0.72rem;
      color: #8e8e93;
      background: #f2f2f7;

      padding: 3px 6px;
      border-radius: 5px;
    }

    .log-visit {
      flex: 1;

      font-size: 0.98rem;
      font-weight: 700;
      color: #007aff;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .log-time {
      margin-top: 5px;

      font-size: 0.78rem;
      color: #636366;
    }

    .log-content-preview {
      margin-top: 7px;

      font-size: 0.82rem;
      line-height: 1.4;

      color: #3a3a3c;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* =========================
       詳細
       ========================= */

    .log-detail {
      display: none;

      border-top: 1px solid #e5e5ea;
      padding: 12px;

      background: #f8f9fa;

      font-size: 0.82rem;
      line-height: 1.65;
    }

    .log-detail.open {
      display: block;
    }

    .detail-row {
      margin-bottom: 7px;
    }

    .detail-label {
      color: #8e8e93;
      font-size: 0.74rem;
    }

    .detail-value {
      color: #1c1c1e;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* =========================
       ログ操作
       ========================= */

    .log-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;

      margin-top: 10px;
    }

    .btn-sm {
      min-height: 40px;

      border: none;
      border-radius: 8px;

      font-size: 0.82rem;
      font-weight: 600;

      cursor: pointer;
    }

    .btn-mail-sm {
      background: #34c759;
      color: white;
    }

    .btn-del-sm {
      background: #ff3b30;
      color: white;
    }

    /* =========================
       一括操作
       ========================= */

    .utility-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;

      margin-bottom: 12px;
    }

    .btn-secondary,
    .btn-danger {
      min-height: 42px;

      border: none;
      border-radius: 9px;

      color: white;
      font-size: 0.82rem;
      font-weight: 600;

      cursor: pointer;
    }

    .btn-secondary {
      background: #5856d6;
    }

    .btn-danger {
      background: #ff3b30;
    }

    /* =========================
       空ログ
       ========================= */

    .empty-log {
      padding: 18px 8px;

      text-align: center;

      color: #8e8e93;
      font-size: 0.82rem;
    }

    /* =========================
       レスポンシブ
       ========================= */

    @media (max-width: 380px) {
      body {
        padding: 8px;
      }

      .card {
        padding: 13px;
      }

      .attendee-group {
        grid-template-columns: 1fr 82px;
      }
    }
  </style>

</head>

<script>

  /* =====================================================
     現在の訪問データ
     ===================================================== */

  let currentData = {

    startTime: '',
    startDateObj: null,

    endTime: '',
    duration: '',

    latitude: null,
    longitude: null

  };


  /* =====================================================
     起動時
     ===================================================== */

  window.onload = function() {

    renderLogs();

    updateStatus();

  };


  /* =====================================================
     開始
     ===================================================== */

  function startRecord() {

    const now = new Date();

    currentData.startDateObj = now;

    currentData.startTime =
      now.toLocaleString('ja-JP');

    currentData.endTime = '';
    currentData.duration = '';

    currentData.latitude = null;
    currentData.longitude = null;


    /* 表示 */

    document.getElementById('statusText').textContent =
      '訪問中';

    document.getElementById('statusDot')
      .classList.add('active');

    document.getElementById('statusTime').textContent =
      formatTime(now);


    document.getElementById('startTime').textContent =
      currentData.startTime;

    document.getElementById('endTime').textContent =
      '未記録';

    document.getElementById('duration').textContent =
      '-';

    document.getElementById('locationInfo').textContent =
      '取得中...';

    document.getElementById('timeInfo')
      .classList.add('show');


    /* ボタン状態 */

    document.getElementById('startButton').disabled = true;

    document.getElementById('endButton').disabled = false;


    /* GPS */

    if ("geolocation" in navigator) {

      navigator.geolocation.getCurrentPosition(

        function(position) {

          currentData.latitude =
            position.coords.latitude;

          currentData.longitude =
            position.coords.longitude;


          document.getElementById('locationInfo')
            .textContent =
            '取得済み';

        },

        function(error) {

          document.getElementById('locationInfo')
            .textContent =
            '取得できませんでした';

        },

        {
          enableHighAccuracy: true,
          timeout: 10000
        }

      );

    } else {

      document.getElementById('locationInfo')
        .textContent =
        '位置情報非対応';

    }

  }


  /* =====================================================
     終了
     ===================================================== */

  function endRecord() {

    if (!currentData.startDateObj) {

      alert(
        '先に「開始」を押してください。'
      );

      return;

    }


    const endDate = new Date();

    currentData.endTime =
      endDate.toLocaleString('ja-JP');


    const diffMs =
      endDate - currentData.startDateObj;

    const diffMins =
      Math.round(diffMs / (1000 * 60));


    currentData.duration =
      `${diffMins} 分間`;


    /* 表示 */

    document.getElementById('statusText').textContent =
      '終了済み';

    document.getElementById('statusTime').textContent =
      formatTime(endDate);

    document.getElementById('statusDot')
      .classList.remove('active');

    document.getElementById('endTime').textContent =
      currentData.endTime;

    document.getElementById('duration').textContent =
      currentData.duration;


    /* ボタン */

    document.getElementById('startButton').disabled = false;

    document.getElementById('endButton').disabled = true;

  }


  /* =====================================================
     記録保存
     ===================================================== */

  function saveRecord(e) {

    e.preventDefault();


    if (!currentData.startTime) {

      alert(
        '先に「開始」を押してください。'
      );

      return;

    }


    /* 訪問先 */

    const visitTarget =
      document.getElementById('visitTarget')
        .value
        .trim();


    if (!visitTarget) {

      alert(
        '訪問先を入力してください。'
      );

      document.getElementById('visitTarget')
        .focus();

      return;

    }


    /* 打合せ者 */

    const nameVal =
      document.getElementById('attendeeName')
        .value
        .trim();

    const titleVal =
      document.getElementById('title')
        .value;


    const attendee =
      nameVal
        ? `${nameVal} ${titleVal}`
        : '';


    /* 車両 */

    const mileageVal =
      document.getElementById('mileage')
        .value
        .trim();

    const gasolineVal =
      document.getElementById('gasoline')
        .value
        .trim();

    const gasolineCostVal =
      document.getElementById('gasolineCost')
        .value
        .trim();


    /* Map */

    const mapUrl =
      (currentData.latitude !== null &&
       currentData.longitude !== null)

        ? `https://maps.google.com/?q=${currentData.latitude},${currentData.longitude}`

        : '';


    /* レコード */

    const record = {

      id: Date.now(),

      startTime:
        currentData.startTime,

      endTime:
        currentData.endTime || '未記録',

      duration:
        currentData.duration || '-',

      mapUrl:
        mapUrl,

      latitude:
        currentData.latitude,

      longitude:
        currentData.longitude,

      visitTarget:
        visitTarget,

      attendee:
        attendee,

      mileage:
        mileageVal,

      gasoline:
        gasolineVal,

      gasolineCost:
        gasolineCostVal,

      content:
        document.getElementById('meetingContent')
          .value
          .trim()

    };


    /* 保存 */

    let logs =
      JSON.parse(
        localStorage.getItem('meetingLogs') || '[]'
      );


    logs.push(record);


    localStorage.setItem(
      'meetingLogs',
      JSON.stringify(logs)
    );


    /* 表示 */

    alert('記録しました。');


    resetForm();

    renderLogs();


    /*
      次の訪問先をすぐ入力できるように
      訪問先へフォーカス
    */

    document.getElementById('visitTarget')
      .focus();

  }


  /* =====================================================
     フォーム初期化
     ===================================================== */

  function resetForm() {

    document.getElementById('recordForm')
      .reset();


    currentData = {

      startTime: '',
      startDateObj: null,

      endTime: '',
      duration: '',

      latitude: null,
      longitude: null

    };


    document.getElementById('statusText')
      .textContent =
      '未開始';

    document.getElementById('statusDot')
      .classList.remove('active');

    document.getElementById('statusTime')
      .textContent =
      '-';


    document.getElementById('timeInfo')
      .classList.remove('show');


    document.getElementById('startButton')
      .disabled = false;

    document.getElementById('endButton')
      .disabled = true;

  }


  /* =====================================================
     ログ表示
     ===================================================== */

  function renderLogs() {

    const container =
      document.getElementById('logContainer');


    const logs =
      JSON.parse(
        localStorage.getItem('meetingLogs') || '[]'
      );


    document.getElementById('logCount')
      .textContent =
      `${logs.length}件`;


    if (logs.length === 0) {

      container.innerHTML = `
        <div class="empty-log">
          保存された記録はありません。
        </div>
      `;

      return;

    }


    /*
      新しい記録を上に表示
    */

    const displayLogs =
      [...logs].reverse();


    container.innerHTML =
      displayLogs.map(function(log, reverseIndex) {

        const originalIndex =
          logs.length - reverseIndex;


        const contentPreview =
          log.content
            ? escapeHtml(log.content)
            : '打合せ内容なし';


        const mapLink =
          log.mapUrl
            ? `<a href="${log.mapUrl}" target="_blank">Google Mapを開く</a>`
            : '位置情報なし';


        return `

          <div class="log-item">

            <div
              class="log-summary"
              onclick="toggleDetail(${log.id})">

              <div class="log-top">

                <div class="log-visit">
                  ${escapeHtml(log.visitTarget)}
                </div>

                <div class="log-number">
                  #${originalIndex}
                </div>

              </div>

              <div class="log-time">
                ${escapeHtml(log.startTime)}
                ／
                ${escapeHtml(log.duration)}
              </div>

              <div class="log-content-preview">
                ${contentPreview}
              </div>

            </div>


            <div
              id="detail-${log.id}"
              class="log-detail">

              <div class="detail-row">

                <div class="detail-label">
                  開始日時
                </div>

                <div class="detail-value">
                  ${escapeHtml(log.startTime)}
                </div>

              </div>


              <div class="detail-row">

                <div class="detail-label">
                  終了日時
                </div>

                <div class="detail-value">
                  ${escapeHtml(log.endTime)}
                </div>

              </div>


              <div class="detail-row">

                <div class="detail-label">
                  滞在時間
                </div>

                <div class="detail-value">
                  ${escapeHtml(log.duration)}
                </div>

              </div>


              <div class="detail-row">

                <div class="detail-label">
                  打合せ者
                </div>

                <div class="detail-value">
                  ${escapeHtml(log.attendee || '')}
                </div>

              </div>


              <div class="detail-row">

                <div class="detail-label">
                  走行距離
                </div>

                <div class="detail-value">
                  ${log.mileage
                    ? escapeHtml(log.mileage) + ' km'
                    : ''}
                </div>

              </div>


              <div class="detail-row">

                <div class="detail-label">
                  給油量
                </div>

                <div class="detail-value">
                  ${log.gasoline
                    ? escapeHtml(log.gasoline) + ' L'
                    : ''}
                </div>

              </div>


              <div class="detail-row">

                <div class="detail-label">
                  給油金額
                </div>

                <div class="detail-value">
                  ${log.gasolineCost
                    ? escapeHtml(log.gasolineCost) + ' 円'
                    : ''}
                </div>

              </div>


              <div class="detail-row">

                <div class="detail-label">
                  打合せ内容
                </div>

                <div class="detail-value">
                  ${escapeHtml(log.content || '')}
                </div>

              </div>


              <div class="detail-row">

                <div class="detail-label">
                  位置情報
                </div>

                <div class="detail-value">
                  ${mapLink}
                </div>

              </div>


              <div class="log-actions">

                <button
                  type="button"
                  class="btn-sm btn-mail-sm"
                  onclick="sendSingleMail(${log.id})">
                  メール作成
                </button>

                <button
                  type="button"
                  class="btn-sm btn-del-sm"
                  onclick="deleteLog(${log.id})">
                  削除
                </button>

              </div>

            </div>

          </div>

        `;

      }).join('');

  }


  /* =====================================================
     詳細開閉
     ===================================================== */

  function toggleDetail(id) {

    const detail =
      document.getElementById(`detail-${id}`);


    if (!detail) return;


    detail.classList.toggle('open');

  }


  /* =====================================================
     個別メール
     ===================================================== */

  function sendSingleMail(id) {

    const logs =
      JSON.parse(
        localStorage.getItem('meetingLogs') || '[]'
      );


    const log =
      logs.find(function(item) {

        return item.id === id;

      });


    if (!log) return;


    const subject =
      encodeURIComponent(
        `【打合せ記録】${log.visitTarget}`
      );


    const body =
      encodeURIComponent(

        `■ 訪問先: ${log.visitTarget}\n` +

        `■ 開始日時: ${log.startTime}\n` +

        `■ 終了日時: ${log.endTime}\n` +

        `■ 滞在時間: ${log.duration}\n` +

        `■ 打合せ者: ${log.attendee}\n` +

        `■ 走行距離: ${log.mileage} km\n` +

        `■ 給油量: ${log.gasoline} L\n` +

        `■ 給油金額: ${log.gasolineCost} 円\n` +

        `■ 内容:\n${log.content}\n\n` +

        `■ 位置情報:\n${log.mapUrl || '位置情報なし'}`

      );


    window.location.href =
      `mailto:?subject=${subject}&body=${body}`;

  }


  /* =====================================================
     全件メール
     ===================================================== */

  function sendAllMail() {

    const logs =
      JSON.parse(
        localStorage.getItem('meetingLogs') || '[]'
      );


    if (logs.length === 0) {

      alert(
        '送信する記録がありません。'
      );

      return;

    }


    const subject =
      encodeURIComponent(
        `【業務打合せ記録】全${logs.length}件`
      );


    let bodyText =
      `業務打合せ記録一覧（全${logs.length}件）\n` +
      `====================\n\n`;


    logs.forEach(function(log, i) {

      bodyText +=
        `【件名 #${i + 1}】${log.visitTarget}\n`;

      bodyText +=
        `開始日時: ${log.startTime}\n`;

      bodyText +=
        `終了日時: ${log.endTime}\n`;

      bodyText +=
        `滞在時間: ${log.duration}\n`;

      bodyText +=
        `打合せ者: ${log.attendee}\n`;

      bodyText +=
        `走行距離: ${log.mileage} km\n`;

      bodyText +=
        `給油量: ${log.gasoline} L\n`;

      bodyText +=
        `給油金額: ${log.gasolineCost} 円\n`;

      bodyText +=
        `内容:\n${log.content}\n`;

      bodyText +=
        `位置情報: ${log.mapUrl || '位置情報なし'}\n`;

      bodyText +=
        `--------------------\n\n`;

    });


    window.location.href =
      `mailto:?subject=${subject}&body=${encodeURIComponent(bodyText)}`;

  }


  /* =====================================================
     個別削除
     ===================================================== */

  function deleteLog(id) {

    if (
      !confirm(
        'この記録を削除してもよろしいですか？'
      )
    ) {

      return;

    }


    let logs =
      JSON.parse(
        localStorage.getItem('meetingLogs') || '[]'
      );


    logs =
      logs.filter(function(item) {

        return item.id !== id;

      });


    localStorage.setItem(
      'meetingLogs',
      JSON.stringify(logs)
    );


    renderLogs();

  }


  /* =====================================================
     全削除
     ===================================================== */

  function clearAllLogs() {

    const logs =
      JSON.parse(
        localStorage.getItem('meetingLogs') || '[]'
      );


    if (logs.length === 0) {

      alert(
        '削除する記録がありません。'
      );

      return;

    }


    if (
      !confirm(
        `全${logs.length}件の記録を消去します。\n\nこの操作は元に戻せません。`
      )
    ) {

      return;

    }


    localStorage.removeItem(
      'meetingLogs'
    );


    renderLogs();

  }


  /* =====================================================
     ステータス更新
     ===================================================== */

  function updateStatus() {

    if (currentData.startTime) {

      document.getElementById('statusText')
        .textContent =
        '訪問中';

    } else {

      document.getElementById('statusText')
        .textContent =
        '未開始';

    }

  }


  /* =====================================================
     時刻表示
     ===================================================== */

  function formatTime(date) {

    return date.toLocaleTimeString(
      'ja-JP',
      {
        hour: '2-digit',
        minute: '2-digit'
      }
    );

  }


  /* =====================================================
     HTMLエスケープ
     ===================================================== */

  function escapeHtml(value) {

    if (value === null ||
        value === undefined) {

      return '';

    }


    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }

</script>

</body>
</html>

<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">

<title>営業日報</title>

<style>
:root{
  --bg:#f7f8fa;
  --card:#ffffff;
  --text:#374151;
  --sub:#6b7280;
  --border:#e5e7eb;

  --daily-bg:#e8f2f8;
  --daily-border:#c8dfe9;

  --vehicle-bg:#e8f4ed;
  --vehicle-border:#c9e2d3;

  --start-bg:#dcecf7;
  --start-border:#bdd8e8;

  --end-bg:#f9eadc;
  --end-border:#ead0b8;

  --record-bg:#eee5f6;
  --record-border:#d8c5e8;

  --mail-bg:#f8e6ed;
  --mail-border:#e7c6d3;

  --input:#fbfcfd;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Yu Gothic",
    "Hiragino Kaku Gothic ProN",
    Meiryo,
    sans-serif;
}

body{
  padding-bottom:env(safe-area-inset-bottom);
}

button,
input,
textarea{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:640px;
  min-height:100vh;
  margin:0 auto;
  padding:12px;
}

/* =========================
   ヘッダー
========================= */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  padding:12px 14px;
  margin-bottom:10px;

  background:var(--daily-bg);
  border:1px solid var(--daily-border);
  border-radius:16px;
}

.title-area{
  min-width:0;
}

.title{
  font-size:20px;
  font-weight:700;
  line-height:1.2;
}

.date{
  margin-top:4px;
  font-size:14px;
  color:var(--sub);
}

.vehicle-button{
  flex:0 0 auto;

  min-height:44px;
  padding:8px 14px;

  border:1px solid var(--vehicle-border);
  border-radius:12px;

  background:var(--vehicle-bg);
  color:#365443;

  font-weight:700;
}

/* =========================
   画面
========================= */

.screen{
  display:none;
}

.screen.active{
  display:block;
}

/* =========================
   カード
========================= */

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  margin-bottom:10px;
  box-shadow:0 1px 3px rgba(0,0,0,.03);
}

.card-title{
  margin-bottom:12px;
  font-size:15px;
  font-weight:700;
}

/* =========================
   訪問入力
========================= */

.visit-number{
  text-align:center;
  font-size:28px;
  font-weight:700;
  margin:4px 0 14px;
}

.field{
  margin-bottom:12px;
}

.field:last-child{
  margin-bottom:0;
}

.field-label{
  display:block;
  margin-bottom:5px;
  font-size:13px;
  color:var(--sub);
}

input,
textarea{
  width:100%;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--input);
  color:var(--text);
  outline:none;
}

input{
  min-height:44px;
  padding:9px 11px;
}

textarea{
  min-height:82px;
  padding:9px 11px;
  resize:vertical;
}

input:focus,
textarea:focus{
  border-color:#b9c9d5;
  background:#fff;
}

/* =========================
   メインボタン
========================= */

.action-button{
  width:100%;
  min-height:52px;

  border-radius:13px;
  border:1px solid;

  font-size:17px;
  font-weight:700;
}

.start-button{
  background:var(--start-bg);
  border-color:var(--start-border);
  color:#31546a;
}

.end-button{
  background:var(--end-bg);
  border-color:var(--end-border);
  color:#765337;
}

.record-button{
  background:var(--record-bg);
  border-color:var(--record-border);
  color:#624878;
}

.mail-button{
  background:var(--mail-bg);
  border-color:var(--mail-border);
  color:#75485a;
}

.secondary-button{
  width:100%;
  min-height:44px;

  border:1px solid var(--border);
  border-radius:11px;

  background:#fff;
  color:var(--text);
}

/* =========================
   終了画面
========================= */

.visit-name{
  text-align:center;
  margin:-4px 0 14px;

  font-size:18px;
  font-weight:700;
}

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.info-item{
  padding:10px;

  background:#fafafa;
  border:1px solid var(--border);
  border-radius:10px;
}

.info-label{
  display:block;
  margin-bottom:4px;
  font-size:12px;
  color:var(--sub);
}

.info-value{
  font-size:14px;
}

/* =========================
   時間・位置編集
========================= */

.edit-section{
  padding:12px;
  margin-bottom:10px;

  border-radius:12px;
  border:1px solid var(--border);
  background:#fafafa;
}

.edit-section-title{
  margin-bottom:8px;
  font-size:14px;
  font-weight:700;
}

.edit-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

/* =========================
   車両画面
========================= */

.vehicle-screen-card{
  background:var(--vehicle-bg);
  border-color:var(--vehicle-border);
}

.vehicle-state{
  text-align:center;
  margin-bottom:14px;

  font-size:14px;
  color:var(--sub);
}

.vehicle-action{
  margin-bottom:16px;
}

.vehicle-button-large{
  width:100%;
  min-height:54px;

  border-radius:13px;
  border:1px solid var(--vehicle-border);

  background:#dcefe4;
  color:#365443;

  font-size:18px;
  font-weight:700;
}

.vehicle-history{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.vehicle-history-item{
  padding:10px;

  background:rgba(255,255,255,.65);
  border:1px solid var(--vehicle-border);
  border-radius:10px;
}

.vehicle-history-label{
  display:block;
  font-size:12px;
  color:var(--sub);
}

.vehicle-history-value{
  margin-top:3px;
  font-size:14px;
}

/* =========================
   下部操作
========================= */

.bottom-actions{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
  margin-top:10px;
}

/* =========================
   小さい画面
========================= */

@media(max-width:380px){
  .app{
    padding:8px;
  }

  .card{
    padding:13px;
  }

  .header{
    padding:10px 11px;
  }

  .title{
    font-size:18px;
  }

  .vehicle-button{
    padding:7px 10px;
  }

  textarea{
    min-height:70px;
  }
}
</style>

</head>

<body>

<div class="app">

  <!-- =========================
       ヘッダー
  ========================== -->

```
<div class="title-area">
  <div class="title">営業日報</div>

</div>

<button

  <!-- =========================

  <main id="meetingScreen" class="screen">

```
<section class="card">

  </div>

  <div class="visit-name" id="meetingVisitTarget"></div>

  <button

</section>
```

  </main>

  <!-- =========================
       終了情報編集画面
  ========================== -->

  <main id="finishScreen" class="screen">

```
<section class="card">

  <div class="visit-number" id="finishVisitNumber">

  </div>

  <div class="visit-name" id="finishVisitTarget"></div>

  <!-- 開始 -->
  <div class="edit-section">

    <div class="field">

  <main id="vehicleScreen" class="screen">

<script>
"use strict";

/* =========================================================
   定数
========================================================= */

const STORAGE_LOGS = "meetingLogs";
const STORAGE_DAILY = "dailyVehicleInfo";


/* =========================================================
   状態
========================================================= */

let dailyData = loadDailyData();

let currentVisit = {
  number: 1,
  target: "",
  startTime: "",
  startLocation: "",
  endTime: "",
  endLocation: "",
  attendee: "",
  content: "",
  startLat: null,
  startLng: null,
  endLat: null,
  endLng: null
};


/* =========================================================
   DOM
========================================================= */

const reportScreen = document.getElementById("reportScreen");
const meetingScreen = document.getElementById("meetingScreen");
const finishScreen = document.getElementById("finishScreen");
const vehicleScreen = document.getElementById("vehicleScreen");

const currentDate = document.getElementById("currentDate");

const vehicleButton = document.getElementById("vehicleButton");
const vehicleCloseButton = document.getElementById("vehicleCloseButton");

const visitNumber = document.getElementById("visitNumber");
const meetingVisitNumber = document.getElementById("meetingVisitNumber");
const finishVisitNumber = document.getElementById("finishVisitNumber");

const visitTarget = document.getElementById("visitTarget");
const meetingVisitTarget = document.getElementById("meetingVisitTarget");
const finishVisitTarget = document.getElementById("finishVisitTarget");

const startButton = document.getElementById("startButton");
const endButton = document.getElementById("endButton");
const recordButton = document.getElementById("recordButton");
const mailButton = document.getElementById("mailButton");

const attendee = document.getElementById("attendee");
const content = document.getElementById("content");

const finishAttendee = document.getElementById("finishAttendee");
const finishContent = document.getElementById("finishContent");

const startTime = document.getElementById("startTime");
const startLocation = document.getElementById("startLocation");

const endTime = document.getElementById("endTime");
const endLocation = document.getElementById("endLocation");

const vehicleState = document.getElementById("vehicleState");

const departureArea = document.getElementById("departureArea");
const returnArea = document.getElementById("returnArea");

const departureDistance = document.getElementById("departureDistance");
const departureDistanceAfter = document.getElementById("departureDistanceAfter");
const returnDistance = document.getElementById("returnDistance");
const fuelAmount = document.getElementById("fuelAmount");

const departureTime = document.getElementById("departureTime");
const departureLocation = document.getElementById("departureLocation");

const returnTime = document.getElementById("returnTime");
const returnLocation = document.getElementById("returnLocation");

const departureButton = document.getElementById("departureButton");
const returnButton = document.getElementById("returnButton");


/* =========================================================
   初期化
========================================================= */

function init(){

  currentDate.textContent = formatDateDisplay(getTodayKey());

  loadVehicleInputs();

  updateVisitNumber();

  showScreen("report");

}


/* =========================================================
   日付
========================================================= */

function getTodayKey(){

  const now = new Date();

  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");

  return `${y}-${m}-${d}`;
}


function formatDateDisplay(dateKey){

  const parts = dateKey.split("-");

  if(parts.length !== 3){
    return dateKey;
  }

  return `${parts[0]}/${parts[1]}/${parts[2]}`;
}


/* =========================================================
   画面切替
========================================================= */

function showScreen(name){

  reportScreen.classList.remove("active");
  meetingScreen.classList.remove("active");
  finishScreen.classList.remove("active");
  vehicleScreen.classList.remove("active");

  if(name === "report"){
    reportScreen.classList.add("active");
  }

  if(name === "meeting"){
    meetingScreen.classList.add("active");
  }

  if(name === "finish"){
    finishScreen.classList.add("active");
  }

  if(name === "vehicle"){
    vehicleScreen.classList.add("active");
  }

  window.scrollTo({
    top:0,
    behavior:"instant"
  });
}


/* =========================================================
   訪問番号
========================================================= */

function numberToCircle(number){

  const numbers = [
    "①","②","③","④","⑤",
    "⑥","⑦","⑧","⑨","⑩",
    "⑪","⑫","⑬","⑭","⑮",
    "⑯","⑰","⑱","⑲","⑳"
  ];

  if(number >= 1 && number <= numbers.length){
    return numbers[number - 1];
  }

  return String(number);
}


function getTodayVisitCount(){

  const logs = loadLogs();

  const today = getTodayKey();

  return logs.filter(log => log.date === today).length;
}


function getNextVisitNumber(){

  return getTodayVisitCount() + 1;
}


function updateVisitNumber(){

  const number = getNextVisitNumber();

  currentVisit.number = number;

  const display = numberToCircle(number);

  visitNumber.textContent = display;
  meetingVisitNumber.textContent = display;
  finishVisitNumber.textContent = display;
}


/* =========================================================
   現在時刻
========================================================= */

function getCurrentTime(){

  const now = new Date();

  return String(now.getHours()).padStart(2,"0")
       + ":"
       + String(now.getMinutes()).padStart(2,"0");
}


/* =========================================================
   位置情報
========================================================= */

function getLocation(callback){

  if(!navigator.geolocation){
    callback(null);
    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(position){

      callback({
        lat:position.coords.latitude,
        lng:position.coords.longitude
      });

    },

    function(){

      callback(null);

    },

    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:0
    }

  );
}


/* =========================================================
   スタート
========================================================= */

startButton.addEventListener("click", function(){

  const target = visitTarget.value.trim();

  if(target === ""){
    visitTarget.focus();
    return;
  }

  currentVisit.target = target;
  currentVisit.startTime = getCurrentTime();

  startTime.value = currentVisit.startTime;

  meetingVisitTarget.textContent = target;

  getLocation(function(location){

    if(location){

      currentVisit.startLat = location.lat;
      currentVisit.startLng = location.lng;

      startLocation.value =
        location.lat.toFixed(6)
        + ", "
        + location.lng.toFixed(6);

    }else{

      startLocation.value = "";

    }

  });

  attendee.value = "";
  content.value = "";

  showScreen("meeting");

});


/* =========================================================
   終了
========================================================= */

endButton.addEventListener("click", function(){

  currentVisit.endTime = getCurrentTime();

  endTime.value = currentVisit.endTime;

  finishVisitTarget.textContent = currentVisit.target;

  finishAttendee.value = attendee.value;
  finishContent.value = content.value;

  getLocation(function(location){

    if(location){

      currentVisit.endLat = location.lat;
      currentVisit.endLng = location.lng;

      endLocation.value =
        location.lat.toFixed(6)
        + ", "
        + location.lng.toFixed(6);

    }else{

      endLocation.value = "";

    }

  });

  showScreen("finish");

});


/* =========================================================
   記録
========================================================= */

recordButton.addEventListener("click", function(){

  currentVisit.startTime = startTime.value.trim();
  currentVisit.startLocation = startLocation.value.trim();

  currentVisit.attendee = finishAttendee.value.trim();
  currentVisit.content = finishContent.value.trim();

  currentVisit.endTime = endTime.value.trim();
  currentVisit.endLocation = endLocation.value.trim();

  const log = {
    date:getTodayKey(),
    number:currentVisit.number,

    target:currentVisit.target,

    startTime:currentVisit.startTime,
    startLocation:currentVisit.startLocation,

    endTime:currentVisit.endTime,
    endLocation:currentVisit.endLocation,

    attendee:currentVisit.attendee,
    content:currentVisit.content,

    startLat:currentVisit.startLat,
    startLng:currentVisit.startLng,

    endLat:currentVisit.endLat,
    endLng:currentVisit.endLng,

    createdAt:new Date().toISOString()
  };

  const logs = loadLogs();

  logs.push(log);

  localStorage.setItem(
    STORAGE_LOGS,
    JSON.stringify(logs)
  );

  resetCurrentVisit();

  updateVisitNumber();

  showScreen("report");

  visitTarget.focus();

});


/* =========================================================
   現在の訪問をリセット
========================================================= */

function resetCurrentVisit(){

  currentVisit = {
    number:getNextVisitNumber(),
    target:"",
    startTime:"",
    startLocation:"",
    endTime:"",
    endLocation:"",
    attendee:"",
    content:"",
    startLat:null,
    startLng:null,
    endLat:null,
    endLng:null
  };

  visitTarget.value = "";

  startTime.value = "";
  startLocation.value = "";

  endTime.value = "";
  endLocation.value = "";

  attendee.value = "";
  content.value = "";

  finishAttendee.value = "";
  finishContent.value = "";

}


/* =========================================================
   ログ読み込み
========================================================= */

function loadLogs(){

  try{

    const data = localStorage.getItem(STORAGE_LOGS);

    if(!data){
      return [];
    }

    const logs = JSON.parse(data);

    return Array.isArray(logs) ? logs : [];

  }catch(error){

    return [];

  }

}


/* =========================================================
   車両情報
========================================================= */

function loadDailyData(){

  try{

    const data = localStorage.getItem(STORAGE_DAILY);

    if(!data){
      return {};
    }

    const parsed = JSON.parse(data);

    return parsed && typeof parsed === "object"
      ? parsed
      : {};

  }catch(error){

    return {};

  }

}


function saveDailyData(){

  localStorage.setItem(
    STORAGE_DAILY,
    JSON.stringify(dailyData)
  );

}


function getTodayVehicleData(){

  const today = getTodayKey();

  if(!dailyData[today]){

    dailyData[today] = {
      departure:{
        time:"",
        location:"",
        distance:""
      },

      return:{
        time:"",
        location:"",
        distance:"",
        fuel:""
      },

      status:"before"
    };

  }

  return dailyData[today];

}


function loadVehicleInputs(){

  const vehicle = getTodayVehicleData();

  departureDistance.value =
    vehicle.departure.distance || "";

  departureDistanceAfter.value =
    vehicle.departure.distance || "";

  departureTime.value =
    vehicle.departure.time || "";

  departureLocation.value =
    vehicle.departure.location || "";

  returnDistance.value =
    vehicle.return.distance || "";

  fuelAmount.value =
    vehicle.return.fuel || "";

  returnTime.value =
    vehicle.return.time || "";

  returnLocation.value =
    vehicle.return.location || "";

  updateVehicleUI();

}


/* =========================================================
   車両情報画面
========================================================= */

vehicleButton.addEventListener("click", function(){

  loadVehicleInputs();

  showScreen("vehicle");

});


vehicleCloseButton.addEventListener("click", function(){

  showScreen("report");

});


/* =========================================================
   発車
========================================================= */

departureButton.addEventListener("click", function(){

  const vehicle = getTodayVehicleData();

  vehicle.departure.distance =
    departureDistance.value.trim();

  vehicle.departure.time =
    departureTime.value.trim();

  vehicle.departure.location =
    departureLocation.value.trim();

  vehicle.status = "departed";

  saveDailyData();

  updateVehicleUI();

});


/* =========================================================
   帰社
========================================================= */

returnButton.addEventListener("click", function(){

  const vehicle = getTodayVehicleData();

  vehicle.departure.distance =
    departureDistanceAfter.value.trim();

  vehicle.return.distance =
    returnDistance.value.trim();

  vehicle.return.fuel =
    fuelAmount.value.trim();

  vehicle.return.time =
    returnTime.value.trim();

  vehicle.return.location =
    returnLocation.value.trim();

  vehicle.status = "returned";

  saveDailyData();

  updateVehicleUI();

});


/* =========================================================
   車両情報UI
========================================================= */

function updateVehicleUI(){

  const vehicle = getTodayVehicleData();

  if(vehicle.status === "before"){

    vehicleState.textContent = "発車前";

    departureArea.style.display = "block";
    returnArea.style.display = "none";

    departureButton.textContent = "発車";

  }else if(vehicle.status === "departed"){

    vehicleState.textContent = "発車済み";

    departureArea.style.display = "none";
    returnArea.style.display = "block";

    returnButton.textContent = "帰社";

  }else{

    vehicleState.textContent = "帰社済み";

    departureArea.style.display = "none";
    returnArea.style.display = "block";

    returnButton.textContent = "帰社";

  }

}


/* =========================================================
   車両情報の編集値を自動保存
========================================================= */

[
  departureDistance,
  departureDistanceAfter,
  departureTime,
  departureLocation,
  returnDistance,
  fuelAmount,
  returnTime,
  returnLocation
].forEach(function(element){

  element.addEventListener("change", function(){

    const vehicle = getTodayVehicleData();

    vehicle.departure.distance =
      departureDistance.value.trim()
      || departureDistanceAfter.value.trim();

    vehicle.departure.time =
      departureTime.value.trim();

    vehicle.departure.location =
      departureLocation.value.trim();

    vehicle.return.distance =
      returnDistance.value.trim();

    vehicle.return.fuel =
      fuelAmount.value.trim();

    vehicle.return.time =
      returnTime.value.trim();

    vehicle.return.location =
      returnLocation.value.trim();

    saveDailyData();

  });

});


/* =========================================================
   メール作成
========================================================= */

mailButton.addEventListener("click", function(){

  const today = getTodayKey();

  const logs = loadLogs()
    .filter(log => log.date === today)
    .sort((a,b) => Number(a.number) - Number(b.number));

  const vehicle = getTodayVehicleData();

  const body = createMailBody(
    today,
    vehicle,
    logs
  );

  const subject =
    "営業日報 " + formatDateDisplay(today);

  const mailto =
    "mailto:"
    + "?subject="
    + encodeURIComponent(subject)
    + "&body="
    + encodeURIComponent(body);

  window.location.href = mailto;

});


/* =========================================================
   メール本文
========================================================= */

function createMailBody(date, vehicle, logs){

  let body = "";

  body += "営業日報\n";
  body += formatDateDisplay(date);
  body += "\n\n";


  /* 車両 */

  body += "【車両情報】\n";

  body += "発車時："
       + valueOrBlank(vehicle.departure.distance)
       + " km\n";

  body += "発車時間："
       + valueOrBlank(vehicle.departure.time)
       + "\n";

  body += "発車位置："
       + valueOrBlank(vehicle.departure.location)
       + "\n";

  body += "帰社時："
       + valueOrBlank(vehicle.return.distance)
       + " km\n";

  body += "帰社時間："
       + valueOrBlank(vehicle.return.time)
       + "\n";

  body += "帰社位置："
       + valueOrBlank(vehicle.return.location)
       + "\n";

  body += "給油量："
       + valueOrBlank(vehicle.return.fuel)
       + " L\n\n";


  /* 訪問 */

  body += "【訪問記録】\n\n";

  if(logs.length === 0){

    body += "訪問記録なし\n";

  }else{

    logs.forEach(function(log){

      body += numberToCircle(Number(log.number))
           + " "
           + valueOrBlank(log.target)
           + "\n";

      body += "開始時間："
           + valueOrBlank(log.startTime)
           + "\n";

      body += "開始位置："
           + valueOrBlank(log.startLocation)
           + "\n";

      body += "終了時間："
           + valueOrBlank(log.endTime)
           + "\n";

      body += "終了位置："
           + valueOrBlank(log.endLocation)
           + "\n";

      body += "面談者："
           + valueOrBlank(log.attendee)
           + "\n";

      body += "内容："
           + valueOrBlank(log.content)
           + "\n\n";

    });

  }

  return body;

}


/* =========================================================
   空白処理
========================================================= */

function valueOrBlank(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value);

}


/* =========================================================
   起動
========================================================= */

init();

</script>

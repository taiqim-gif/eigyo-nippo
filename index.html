<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<title>営業日報</title>

<style>
:root{
  --bg:#f7f8fa;
  --card:#ffffff;
  --text:#333;
  --sub:#777;
  --border:#dfe3e8;

  --daily:#e8f2f8;
  --vehicle:#e8f4ed;
  --start:#dcecf7;
  --end:#f9eadc;
  --record:#eee5f6;
  --mail:#f8e6ed;
  --delete:#f7e4e4;

  --radius:14px;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  font-size:16px;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 16px;
  background:white;
  color:var(--text);
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

input,
select,
textarea{
  width:100%;
  border:1px solid var(--border);
  border-radius:10px;
  background:#fff;
  padding:11px 12px;
  color:var(--text);
}

textarea{
  min-height:100px;
  resize:vertical;
}

.app{
  max-width:700px;
  margin:0 auto;
  padding:10px 12px 30px;
}

/* ==============================
   ヘッダー
============================== */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}

.header-title{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.header-title h1{
  margin:0;
  font-size:22px;
  white-space:nowrap;
}

.date-display{
  background:var(--daily);
  border-radius:10px;
  padding:7px 10px;
  font-size:14px;
  white-space:nowrap;
}

.header-button{
  min-width:110px;
  background:var(--vehicle);
}

/* ==============================
   画面
============================== */

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
}

.section-title{
  font-weight:700;
  margin-bottom:10px;
}

.visit-number{
  display:inline-block;
  background:var(--daily);
  border-radius:10px;
  padding:7px 12px;
  font-weight:700;
  margin-bottom:12px;
}

.label{
  display:block;
  font-size:14px;
  color:var(--sub);
  margin-bottom:5px;
}

.field{
  margin-bottom:12px;
}

.row{
  display:flex;
  gap:8px;
}

.row > *{
  flex:1;
}

.primary{
  width:100%;
  font-weight:700;
  padding:14px;
}

.start-button{
  background:var(--start);
}

.end-button{
  background:var(--end);
}

.mail-button{
  background:var(--mail);
  margin-bottom:10px;
}

.delete-button{
  width:100%;
  background:var(--delete);
}

/* ==============================
   訪問先入力
============================== */

.visit-target{
  font-size:18px;
}

.info-text{
  color:var(--sub);
  font-size:13px;
  line-height:1.5;
}

/* ==============================
   面談入力
============================== */

.person-row{
  display:flex;
  gap:8px;
}

.person-row input{
  flex:1;
}

.person-row select{
  width:110px;
  flex:none;
}

.content-type{
  margin-bottom:8px;
}

/* ==============================
   完了確認カード
============================== */

.time-summary{
  display:flex;
  align-items:center;
  gap:8px;
  background:#f6f7f8;
  border-radius:10px;
  padding:12px;
  margin-bottom:12px;
}

.time-summary-label{
  color:var(--sub);
  font-size:14px;
}

.time-summary-value{
  font-weight:700;
}

/* ==============================
   車両情報
============================== */

.vehicle-status{
  background:var(--vehicle);
  border-radius:10px;
  padding:10px 12px;
  margin-bottom:12px;
  font-weight:700;
}

.vehicle-block{
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  margin-bottom:12px;
}

.vehicle-block.departure{
  background:#f5faf7;
}

.vehicle-block.return{
  background:#fbf7f2;
}

.vehicle-title{
  font-weight:700;
  margin-bottom:10px;
}

.vehicle-action{
  width:100%;
  margin-top:8px;
  font-weight:700;
}

.departure-button{
  background:var(--start);
}

.return-button{
  background:var(--end);
}

/* ==============================
   小さい画面
============================== */

@media(max-width:480px){

  .app{
    padding:8px 9px 24px;
  }

  .header-title h1{
    font-size:20px;
  }

  .date-display{
    font-size:13px;
    padding:6px 8px;
  }

  .header-button{
    min-width:100px;
    padding:10px 11px;
  }

  .card{
    padding:13px;
  }

  button{
    padding:11px 13px;
  }
}
</style>

</head>

<script>

/* =========================================================
   保存データ
========================================================= */

const LOG_KEY = "meetingLogs";
const VEHICLE_KEY = "dailyVehicleInfo";

let meetingLogs =
  JSON.parse(localStorage.getItem(LOG_KEY) || "[]");

let dailyVehicleInfo =
  JSON.parse(localStorage.getItem(VEHICLE_KEY) || "{}");


/* =========================================================
   現在の訪問
========================================================= */

let currentVisit = {
  number:1,
  target:"",

  startTime:"",
  startLocation:"",
  startLat:"",
  startLng:"",

  endTime:"",
  endLocation:"",
  endLat:"",
  endLng:"",

  person:"",
  personTitle:"",

  contentType:"",
  content:""
};


/* =========================================================
   共通関数
========================================================= */

function getToday(){

  const d = new Date();

  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;
}


function getNowDateTimeLocal(){

  const d = new Date();

  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");

  const h = String(d.getHours()).padStart(2,"0");
  const min = String(d.getMinutes()).padStart(2,"0");

  return `${y}-${m}-${day}T${h}:${min}`;
}


function saveLogs(){

  localStorage.setItem(
    LOG_KEY,
    JSON.stringify(meetingLogs)
  );

}


function saveVehicle(){

  localStorage.setItem(
    VEHICLE_KEY,
    JSON.stringify(dailyVehicleInfo)
  );

}


/* =========================================================
   日付表示
========================================================= */

function updateDate(){

  const d = new Date();

  const y = d.getFullYear();
  const m = d.getMonth() + 1;
  const day = d.getDate();

  const week =
    ["日","月","火","水","木","金","土"][d.getDay()];

  document.getElementById("dateDisplay").textContent =
    `${y}/${m}/${day}（${week}）`;

}


/* =========================================================
   今日の訪問番号
========================================================= */

function getNextVisitNumber(){

  const today = getToday();

  const todayLogs =
    meetingLogs.filter(x => x.date === today);

  return todayLogs.length + 1;

}


function updateVisitNumber(){

  const number =
    getNextVisitNumber();

  currentVisit.number =
    number;

  document.getElementById("visitNumber").textContent =
    `訪問先 ${number}`;

  document.getElementById("meetingVisitNumber").textContent =
    `訪問先 ${number}`;

  document.getElementById("finishVisitNumber").textContent =
    `訪問先 ${number}`;

}


/* =========================================================
   画面切替
========================================================= */

function showScreen(name){

  document.querySelectorAll(".screen")
    .forEach(screen => {

      screen.classList.remove("active");

    });


  document.getElementById(name + "Screen")
    .classList.add("active");


  window.scrollTo({
    top:0,
    behavior:"auto"
  });

}


/* =========================================================
   位置情報
   データとして保存する。
   画面には表示しない。
========================================================= */

function getLocation(){

  return new Promise(resolve => {

    if(!navigator.geolocation){

      resolve({
        location:"",
        lat:"",
        lng:""
      });

      return;
    }


    navigator.geolocation.getCurrentPosition(

      position => {

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        resolve({

          location:`${lat},${lng}`,

          lat:lat,

          lng:lng

        });

      },

      () => {

        resolve({
          location:"",
          lat:"",
          lng:""
        });

      },

      {
        enableHighAccuracy:true,
        timeout:10000,
        maximumAge:0
      }

    );

  });

}


/* =========================================================
   訪問開始
========================================================= */

document.getElementById("startButton")
.addEventListener("click", async () => {

  const target =
    document.getElementById("visitTarget")
    .value.trim();


  if(!target){

    document.getElementById("visitTarget")
      .focus();

    return;

  }


  currentVisit.number =
    getNextVisitNumber();

  currentVisit.target =
    target;

  currentVisit.startTime =
    getNowDateTimeLocal();


  const location =
    await getLocation();


  currentVisit.startLocation =
    location.location;

  currentVisit.startLat =
    location.lat;

  currentVisit.startLng =
    location.lng;


  document.getElementById("meetingVisitTarget")
    .value = target;

  document.getElementById("meetingPerson")
    .value = "";

  document.getElementById("meetingPersonTitle")
    .value = "";

  document.getElementById("meetingContentType")
    .value = "";

  document.getElementById("meetingContent")
    .value = "";


  showScreen("meeting");

});


/* =========================================================
   訪問終了
========================================================= */

document.getElementById("endButton")
.addEventListener("click", async () => {

  currentVisit.target =
    document.getElementById("meetingVisitTarget")
    .value.trim();

  currentVisit.person =
    document.getElementById("meetingPerson")
    .value.trim();

  currentVisit.personTitle =
    document.getElementById("meetingPersonTitle")
    .value;

  currentVisit.contentType =
    document.getElementById("meetingContentType")
    .value;

  currentVisit.content =
    document.getElementById("meetingContent")
    .value;

  currentVisit.endTime =
    getNowDateTimeLocal();


  const location =
    await getLocation();


  currentVisit.endLocation =
    location.location;

  currentVisit.endLat =
    location.lat;

  currentVisit.endLng =
    location.lng;


  document.getElementById("finishVisitTarget")
    .value = currentVisit.target;

  document.getElementById("finishStartTime")
    .value = currentVisit.startTime;

  document.getElementById("finishEndTime")
    .value = currentVisit.endTime;

  document.getElementById("finishPerson")
    .value = currentVisit.person;

  document.getElementById("finishPersonTitle")
    .value = currentVisit.personTitle;

  document.getElementById("finishContentType")
    .value = currentVisit.contentType;

  document.getElementById("finishContent")
    .value = currentVisit.content;


  updateFinishTimeSummary();


  showScreen("finish");


  /*
    終了後、自動的に記録する。
  */

  recordVisit();

});


/* =========================================================
   開始－終了時間表示
========================================================= */

function updateFinishTimeSummary(){

  const start =
    document.getElementById("finishStartTime").value;

  const end =
    document.getElementById("finishEndTime").value;


  const format = value => {

    if(!value) return "";

    return value
      .replace("T"," ")
      .replace(/:\d\d$/,"");

  };


  document.getElementById("finishTimeSummary")
    .textContent =
      `${format(start)} ～ ${format(end)}`;

}


/* =========================================================
   訪問記録
========================================================= */

function recordVisit(){

  currentVisit.target =
    document.getElementById("finishVisitTarget")
    .value.trim();

  currentVisit.startTime =
    document.getElementById("finishStartTime")
    .value;

  currentVisit.endTime =
    document.getElementById("finishEndTime")
    .value;

  currentVisit.person =
    document.getElementById("finishPerson")
    .value.trim();

  currentVisit.personTitle =
    document.getElementById("finishPersonTitle")
    .value;

  currentVisit.contentType =
    document.getElementById("finishContentType")
    .value;

  currentVisit.content =
    document.getElementById("finishContent")
    .value;


  const log = {

    date:getToday(),

    number:currentVisit.number,

    target:currentVisit.target,

    startTime:currentVisit.startTime,
    startLocation:currentVisit.startLocation,

    endTime:currentVisit.endTime,
    endLocation:currentVisit.endLocation,

    startLat:currentVisit.startLat,
    startLng:currentVisit.startLng,

    endLat:currentVisit.endLat,
    endLng:currentVisit.endLng,

    attendee:currentVisit.person,
    attendeeTitle:currentVisit.personTitle,

    contentType:currentVisit.contentType,
    content:currentVisit.content,

    createdAt:new Date().toISOString()

  };


  meetingLogs.push(log);

  saveLogs();


  /* 新しい訪問入力へ */

  currentVisit = {

    number:getNextVisitNumber(),

    target:"",

    startTime:"",
    startLocation:"",
    startLat:"",
    startLng:"",

    endTime:"",
    endLocation:"",
    endLat:"",
    endLng:"",

    person:"",
    personTitle:"",

    contentType:"",
    content:""

  };


  document.getElementById("visitTarget")
    .value = "";


  updateVisitNumber();

  showScreen("report");

}


/* =========================================================
   車両情報
========================================================= */

function getTodayVehicle(){

  const today =
    getToday();


  if(!dailyVehicleInfo[today]){

    dailyVehicleInfo[today] = {

      departure:{
        time:"",
        location:"",
        distance:""
      },

      return:{
        time:"",
        location:"",
        distance:"",
        fuel:""
      },

      status:"before"

    };

  }


  return dailyVehicleInfo[today];

}


/* =========================================================
   車両情報画面
   初回表示時に現在時間・位置情報を自動記入
========================================================= */

async function openVehicleScreen(){

  const vehicle =
    getTodayVehicle();


  if(!vehicle.departure.time){

    vehicle.departure.time =
      getNowDateTimeLocal();


    const location =
      await getLocation();


    vehicle.departure.location =
      location.location;


    saveVehicle();

  }


  loadVehicleInputs();

  showScreen("vehicle");

}


/* =========================================================
   車両入力値表示
========================================================= */

function loadVehicleInputs(){

  const vehicle =
    getTodayVehicle();


  document.getElementById("departureDistance")
    .value =
      vehicle.departure.distance || "";

  document.getElementById("departureTime")
    .value =
      vehicle.departure.time || "";

  document.getElementById("departureLocation")
    .value =
      vehicle.departure.location || "";


  document.getElementById("returnDistance")
    .value =
      vehicle.return.distance || "";

  document.getElementById("returnTime")
    .value =
      vehicle.return.time || "";

  document.getElementById("returnLocation")
    .value =
      vehicle.return.location || "";

  document.getElementById("returnFuel")
    .value =
      vehicle.return.fuel || "";


  updateVehicleStatus();

}


/* =========================================================
   車両状態
========================================================= */

function updateVehicleStatus(){

  const vehicle =
    getTodayVehicle();


  const status =
    vehicle.status;


  const text =
    status === "returned"
      ? "帰社済み"
      : status === "departed"
        ? "発車済み"
        : "発車前";


  document.getElementById("vehicleStatus")
    .textContent = text;

}


/* =========================================================
   発車
========================================================= */

document.getElementById("departureButton")
.addEventListener("click", async () => {

  const vehicle =
    getTodayVehicle();


  vehicle.departure.distance =
    document.getElementById("departureDistance")
    .value;

  vehicle.departure.time =
    document.getElementById("departureTime")
    .value;

  vehicle.departure.location =
    document.getElementById("departureLocation")
    .value;


  if(!vehicle.departure.time){

  }

    vehicle.departure.location =

    "departed";


  saveVehicle();

  loadVehicleInputs();

});

        .value;

      vehicle.return.time =

        .value;

        .value;

/* =========================================================
   ヘッダー動的ボタン
========================================================= */

document.getElementById("vehicleToggleButton")
.addEventListener("click", async () => {

  const vehicleScreen =
    document.getElementById("vehicleScreen");


  const isVehicle =
    vehicleScreen.classList.contains("active");


  if(isVehicle){

    /*
      車両情報表示中
      → 営業日報へ戻る
    */

    document.getElementById("vehicleToggleButton")
      .textContent = "車両情報";


    showScreen("report");

  }else{

    /*
      営業日報表示中
      → 車両情報を表示
    */

    document.getElementById("vehicleToggleButton")
      .textContent = "営業日報";


    await openVehicleScreen();

  }

});


/* =========================================================
   メール送信
========================================================= */

document.getElementById("mailButton")
.addEventListener("click", () => {

  const today =
    getToday();


  const logs =
    meetingLogs
      .filter(x => x.date === today)
      .sort((a,b) => a.number - b.number);


  const vehicle =
    getTodayVehicle();


  let body = "";


  body += `営業日報\n`;
  body += `日付：${today}\n\n`;


  /* 車両情報 */

  body += `【車両情報】\n`;

  body +=
    `発車時 走行距離：${vehicle.departure.distance || ""}\n`;

  body +=
    `発車時 時間：${vehicle.departure.time || ""}\n`;

  body +=
    `発車時 位置：${vehicle.departure.location || ""}\n`;

  body +=
    `帰社時 走行距離：${vehicle.return.distance || ""}\n`;

  body +=
    `帰社時 時間：${vehicle.return.time || ""}\n`;

  body +=
    `帰社時 位置：${vehicle.return.location || ""}\n`;

  body +=
    `給油量：${vehicle.return.fuel || ""}\n\n`;


  /* 訪問 */

  logs.forEach(log => {

    body +=
      `【訪問先 ${log.number}】\n`;

    body +=
      `訪問先：${log.target || ""}\n`;

    body +=
      `時間：${log.startTime || ""} ～ ${log.endTime || ""}\n`;

    body +=
      `面談者：${log.attendee || ""}${log.attendeeTitle || ""}\n`;

    body +=
      `内容区分：${log.contentType || ""}\n`;

    body +=
      `内容：${log.content || ""}\n\n`;

  });


  const subject =
    `営業日報 ${today}`;


  const mailto =
    `mailto:?subject=${encodeURIComponent(subject)}` +
    `&body=${encodeURIComponent(body)}`;


  window.location.href =
    mailto;

});


/* =========================================================
   全データ削除
========================================================= */

document.getElementById("deleteAllButton")
.addEventListener("click", () => {

  const confirmed =
    window.confirm(
      "保存されている営業日報と車両情報をすべて削除します。\n\nこの操作は元に戻せません。\n\n削除しますか？"
    );


  if(!confirmed){

    return;

  }


  /*
    保存データを完全削除
  */

  localStorage.removeItem(LOG_KEY);

  localStorage.removeItem(VEHICLE_KEY);


  /*
    メモリ上のデータも初期化
  */

  meetingLogs = [];

  dailyVehicleInfo = {};


  currentVisit = {

    number:1,

    target:"",

    startTime:"",
    startLocation:"",
    startLat:"",
    startLng:"",

    endTime:"",
    endLocation:"",
    endLat:"",
    endLng:"",

    person:"",
    personTitle:"",

    contentType:"",
    content:""

  };


  /*
    画面を初期状態に戻す
  */

  document.getElementById("visitTarget")
    .value = "";


  updateVisitNumber();


  document.getElementById("vehicleToggleButton")
    .textContent = "車両情報";


  showScreen("report");


  alert("全データを削除しました。");

});

updateDate();

updateVisitNumber();

</script>
